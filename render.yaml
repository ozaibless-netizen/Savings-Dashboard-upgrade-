services:
  - type: web
    name: savings-dashboard-pro
    env: node
    plan: free
    branch: feature/major-upgrade
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FIREBASE_API_KEY
        scope: build,runtime
        value: ${FIREBASE_API_KEY}
      - key: FIREBASE_AUTH_DOMAIN
        scope: build,runtime
        value: ${FIREBASE_AUTH_DOMAIN}
      - key: FIREBASE_PROJECT_ID
        scope: build,runtime
        value: ${FIREBASE_PROJECT_ID}
      - key: FIREBASE_STORAGE_BUCKET
        scope: build,runtime
        value: ${FIREBASE_STORAGE_BUCKET}
      - key: FIREBASE_MESSAGING_SENDER_ID
        scope: build,runtime
        value: ${FIREBASE_MESSAGING_SENDER_ID}
      - key: FIREBASE_APP_ID
        scope: build,runtime
        value: ${FIREBASE_APP_ID}
      - key: FIREBASE_DATABASE_URL
        scope: build,runtime
        value: ${FIREBASE_DATABASE_URL}
      - key: JWT_SECRET
        scope: build,runtime
        value: ${JWT_SECRET}
      - key: NODE_ENV
        scope: build,runtime
        value: production
      - key: PORT
        scope: build,runtime
        value: '3000'
      - key: CORS_ORIGIN
        scope: build,runtime
        value: '*'
